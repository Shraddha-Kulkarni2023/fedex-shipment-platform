server:
  port: 8090

spring:
  application:
    name: ui-service-simulator
  datasource:
    url: jdbc:postgresql://localhost:5432/shipment_db
    username: shipment_user
    password: shipment_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
